services:
  postgres:
    image: postgres:16-alpine
    container_name: poseforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: poseforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - poseforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poseforge"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  poseforge_pgdata:
